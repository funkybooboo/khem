# Basic CI. The gate has a single source of truth: this workflow runs
# `mise run check`, the same command a laptop runs, and the toolchain
# comes from mise.toml via jdx/mise-action - no separately-pinned
# rust version to drift out of sync.
#
# Repo: github.com/funkybooboo/khem, public (ADR-0011).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      # ubuntu-latest ships a rustup-managed toolchain in a minimal
      # profile (rustc/cargo only). mise sees the pinned version as
      # already installed and does not add components (jdx/mise#6000),
      # so ensure them explicitly - idempotent, and still pinned via
      # RUSTUP_TOOLCHAIN=1.98.0.
      - name: ensure rustup components
        run: mise exec -- rustup component add rustfmt clippy
      # No cargo-cache step: zero registry dependencies and mise
      # installs the pinned toolchain in ~20s; caches layered over
      # toolchain installs caused component loss (observed
      # 2026-09-05). Revisit when real dependencies arrive.
      - name: "gate: fmt --check, clippy -D warnings, test --locked"
        run: mise run check