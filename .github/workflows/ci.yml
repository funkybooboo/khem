# Basic CI. The gate has a single source of truth: this workflow runs
# `mise run check`, the same command a laptop runs, and the toolchain
# comes from mise.toml via jdx/mise-action - no separately-pinned
# rust version to drift out of sync.
#
# Repo: github.com/funkybooboo/khem, public (ADR-0011).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      # No cargo-cache step (rust-cache et al.) on purpose: the workspace
      # has zero registry dependencies, mise installs the pinned toolchain
      # in ~20s, and restoring a partial ~/.cargo / ~/.rustup cache over
      # mise's install broke rustup component availability on the second
      # run (observed 2026-09-05: "cargo-fmt is not installed"). Revisit
      # when real dependencies arrive.
      - name: "gate: fmt --check, clippy -D warnings, test --locked"
        run: mise run check