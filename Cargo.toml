[workspace]
resolver = "3"
members = [
    "crates/khem",
    "crates/khem-analysis",
    "crates/khem-chemistry",
    "crates/khem-engine",
    "crates/khem-forcefield",
    "crates/khem-physics",
    "crates/khem-world",
    "crates/khem-worlds",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/funkybooboo/khem"

[workspace.dependencies]
khem-analysis = { path = "crates/khem-analysis" }
khem-chemistry = { path = "crates/khem-chemistry" }
khem-engine = { path = "crates/khem-engine" }
khem-forcefield = { path = "crates/khem-forcefield" }
khem-physics = { path = "crates/khem-physics" }
khem-world = { path = "crates/khem-world" }
khem-worlds = { path = "crates/khem-worlds" }

[workspace.lints.rust]
unsafe_code = "forbid"
